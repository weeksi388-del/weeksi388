<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #181818;
  color: white;
  font-family: Arial, sans-serif;
}

.player {
  width: 100%;
  min-height: 110px;
  padding: 18px 24px;
  display: grid;
  grid-template-columns: 280px 1fr 280px;
  align-items: center;
  gap: 28px;
  border-top: 1px solid #333;
}

.track {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
}

.cover {
  width: 72px;
  height: 72px;
  object-fit: cover;
  flex-shrink: 0;
}

.info {
  min-width: 0;
}

.title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 7px;
}

.artist {
  color: #aaa;
  font-size: 13px;
}

.center {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 13px;
}

.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 28px;
}

button {
  border: 0;
  background: transparent;
  color: white;
  cursor: pointer;
  padding: 0;
}

.skip {
  font-size: 23px;
}

.play {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: white;
  color: black;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.progress-row {
  width: 100%;
  display: grid;
  grid-template-columns: 42px 1fr 42px;
  align-items: center;
  gap: 10px;
  color: #aaa;
  font-size: 11px;
}

input[type="range"] {
  width: 100%;
  cursor: pointer;
  accent-color: white;
}

.volume {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 12px;
}

.volume input {
  width: 100px;
}

@media (max-width: 750px) {
  .player {
    grid-template-columns: 1fr;
  }

  .volume {
    display: none;
  }

  .track {
    justify-content: center;
  }
}
</style>
</head>

<body>

<audio id="audio" src="난 아직.mp3"></audio>

<div class="player">

  <div class="track">
    <img class="cover" src="우성앨범커버.png">

    <div class="info">
      <div class="title">난 아직</div>
      <div class="artist">RE:PLAY · HYESEONG × SEUNGWOO</div>
    </div>
  </div>

  <div class="center">

    <div class="controls">
      <button class="skip" id="prev" title="10초 뒤로">↶</button>
      <button class="play" id="play">▶</button>
      <button class="skip" id="next" title="10초 앞으로">↷</button>
    </div>

    <div class="progress-row">
      <span id="current">0:00</span>
      <input id="progress" type="range" min="0" max="100" value="0" step="0.1">
      <span id="duration">0:00</span>
    </div>

  </div>

  <div class="volume">
    <span>🔊</span>
    <input id="volume" type="range" min="0" max="1" value="1" step="0.01">
  </div>

</div>

<script>
const audio = document.getElementById("audio");
const play = document.getElementById("play");
const progress = document.getElementById("progress");
const current = document.getElementById("current");
const duration = document.getElementById("duration");
const volume = document.getElementById("volume");

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return "0:00";

  const min = Math.floor(seconds / 60);
  const sec = Math.floor(seconds % 60);

  return min + ":" + String(sec).padStart(2, "0");
}

play.addEventListener("click", () => {
  if (audio.paused) {
    audio.play();
  } else {
    audio.pause();
  }
});

audio.addEventListener("play", () => {
  play.textContent = "Ⅱ";
});

audio.addEventListener("pause", () => {
  play.textContent = "▶";
});

audio.addEventListener("loadedmetadata", () => {
  duration.textContent = formatTime(audio.duration);
});

audio.addEventListener("timeupdate", () => {
  current.textContent = formatTime(audio.currentTime);

  if (audio.duration) {
    progress.value = (audio.currentTime / audio.duration) * 100;
  }
});

progress.addEventListener("input", () => {
  if (audio.duration) {
    audio.currentTime = (progress.value / 100) * audio.duration;
  }
});

volume.addEventListener("input", () => {
  audio.volume = volume.value;
});

document.getElementById("prev").addEventListener("click", () => {
  audio.currentTime = Math.max(0, audio.currentTime - 10);
});

document.getElementById("next").addEventListener("click", () => {
  audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 10);
});

audio.addEventListener("ended", () => {
  play.textContent = "▶";
  progress.value = 0;
});
</script>

</body>
</html>
