<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RE:PLAY Player</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #181818;
  color: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

.player {
  width: 100%;
  min-height: 120px;
  padding: 18px 26px;

  display: grid;
  grid-template-columns: 300px minmax(300px, 1fr) 220px;
  align-items: center;
  gap: 30px;

  background: #181818;
  border-top: 1px solid #303030;
}


/* ─────────────
   TRACK INFO
───────────── */

.track-info {
  display: flex;
  align-items: center;
  gap: 15px;
  min-width: 0;
}

.cover {
  width: 82px;
  height: 82px;

  object-fit: cover;
  flex-shrink: 0;
}

.text {
  min-width: 0;
}

.title {
  margin-bottom: 7px;

  font-size: 15px;
  font-weight: 600;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.artist {
  color: #aaaaaa;

  font-size: 12px;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}


/* ─────────────
   CENTER PLAYER
───────────── */

.player-center {
  width: 100%;

  display: flex;
  flex-direction: column;
  align-items: center;

  gap: 12px;
}


/* buttons */

.controls {
  display: flex;
  align-items: center;
  justify-content: center;

  gap: 28px;
}

.control-button {
  border: none;
  background: transparent;

  color: #ffffff;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 4px;
}

.control-button svg {
  width: 23px;
  height: 23px;

  fill: currentColor;
}

.control-button.secondary {
  color: #d0d0d0;
}

.control-button.secondary:hover {
  color: #ffffff;
}

.play-button {
  width: 42px;
  height: 42px;

  border-radius: 50%;

  background: #ffffff;
  color: #111111;

  padding: 0;
}

.play-button svg {
  width: 20px;
  height: 20px;
}


/* progress */

.progress-container {
  width: 100%;

  display: grid;
  grid-template-columns: 38px 1fr 38px;
  align-items: center;

  gap: 10px;
}

.time {
  color: #aaaaaa;

  font-size: 11px;
  text-align: center;
}

input[type="range"] {
  margin: 0;

  cursor: pointer;

  accent-color: #ffffff;
}

#progress {
  width: 100%;
}


/* ─────────────
   VOLUME
───────────── */

.volume-area {
  display: flex;
  align-items: center;
  justify-content: flex-end;

  gap: 10px;
}

.volume-icon {
  width: 20px;
  height: 20px;

  fill: #ffffff;
}

#volume {
  width: 100px;
}


/* ─────────────
   MOBILE
───────────── */

@media (max-width: 800px) {

  .player {
    grid-template-columns: 1fr;
    padding: 20px;
  }

  .track-info {
    justify-content: center;
  }

  .volume-area {
    display: none;
  }

}
</style>
</head>


<body>


<audio
  id="audio"
  preload="metadata"
  src="replay.mp3">
</audio>


<div class="player">


  <!-- TRACK INFO -->

  <div class="track-info">

    <img
      class="cover"
      src="우성앨범커버.png"
      alt="RE:PLAY album cover"
    >

    <div class="text">

      <div class="title">
        난 아직
      </div>

      <div class="artist">
        RE:PLAY · HYESEONG × SEUNGWOO
      </div>

    </div>

  </div>



  <!-- PLAYER -->

  <div class="player-center">


    <div class="controls">


      <!-- BACK 10 SEC -->

      <button
        class="control-button secondary"
        id="back"
        title="10초 뒤로"
        aria-label="10초 뒤로">

        <svg viewBox="0 0 24 24">
          <path d="M11 5V2L6 6l5 4V7c3.31 0 6 2.69 6 6s-2.69 6-6 6a6 6 0 0 1-5.65-4H3.26A8 8 0 1 0 11 5z"/>
        </svg>

      </button>



      <!-- PLAY -->

      <button
        class="control-button play-button"
        id="play"
        aria-label="재생">

        <svg
          id="playIcon"
          viewBox="0 0 24 24">

          <path d="M8 5v14l11-7z"/>

        </svg>

      </button>



      <!-- FORWARD 10 SEC -->

      <button
        class="control-button secondary"
        id="forward"
        title="10초 앞으로"
        aria-label="10초 앞으로">

        <svg viewBox="0 0 24 24">
          <path d="M13 5V2l5 4-5 4V7c-3.31 0-6 2.69-6 6s2.69 6 6 6a6 6 0 0 0 5.65-4h2.09A8 8 0 1 1 13 5z"/>
        </svg>

      </button>


    </div>



    <!-- PROGRESS BAR -->

    <div class="progress-container">

      <span
        class="time"
        id="current">
        0:00
      </span>

      <input
        id="progress"
        type="range"
        min="0"
        max="100"
        value="0"
        step="0.1"
        aria-label="재생 위치"
      >

      <span
        class="time"
        id="duration">
        0:00
      </span>

    </div>


  </div>



  <!-- VOLUME -->

  <div class="volume-area">

    <svg
      class="volume-icon"
      viewBox="0 0 24 24">

      <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zm-2.5-8.23v2.06A7 7 0 0 1 14 18.17v2.06A9 9 0 0 0 14 3.77z"/>

    </svg>

    <input
      id="volume"
      type="range"
      min="0"
      max="1"
      step="0.01"
      value="1"
      aria-label="볼륨"
    >

  </div>


</div>



<script>

const audio =
  document.getElementById("audio");

const playButton =
  document.getElementById("play");

const playIcon =
  document.getElementById("playIcon");

const progress =
  document.getElementById("progress");

const current =
  document.getElementById("current");

const duration =
  document.getElementById("duration");

const volume =
  document.getElementById("volume");

const back =
  document.getElementById("back");

const forward =
  document.getElementById("forward");



/* TIME FORMAT */

function formatTime(seconds) {

  if (!Number.isFinite(seconds)) {
    return "0:00";
  }

  const minutes =
    Math.floor(seconds / 60);

  const remainingSeconds =
    Math.floor(seconds % 60);

  return (
    minutes +
    ":" +
    String(remainingSeconds).padStart(2, "0")
  );

}



/* PLAY / PAUSE */

playButton.addEventListener(
  "click",
  async () => {

    if (audio.paused) {

      try {

        await audio.play();

      }

      catch (error) {

        console.error(
          "Audio playback failed:",
          error
        );

      }

    }

    else {

      audio.pause();

    }

  }
);



/* CHANGE ICON */

audio.addEventListener(
  "play",
  () => {

    playIcon.innerHTML =
      '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';

    playButton.setAttribute(
      "aria-label",
      "일시정지"
    );

  }
);


audio.addEventListener(
  "pause",
  () => {

    playIcon.innerHTML =
      '<path d="M8 5v14l11-7z"/>';

    playButton.setAttribute(
      "aria-label",
      "재생"
    );

  }
);



/* DURATION */

audio.addEventListener(
  "loadedmetadata",
  () => {

    duration.textContent =
      formatTime(audio.duration);

  }
);



/* UPDATE PROGRESS */

audio.addEventListener(
  "timeupdate",
  () => {

    current.textContent =
      formatTime(audio.currentTime);

    if (audio.duration) {

      progress.value =
        (audio.currentTime /
         audio.duration) * 100;

    }

  }
);



/* SEEK */

progress.addEventListener(
  "input",
  () => {

    if (!audio.duration) return;

    audio.currentTime =
      (progress.value / 100) *
      audio.duration;

  }
);



/* VOLUME */

volume.addEventListener(
  "input",
  () => {

    audio.volume =
      Number(volume.value);

  }
);



/* BACK 10 SECONDS */

back.addEventListener(
  "click",
  () => {

    audio.currentTime =
      Math.max(
        0,
        audio.currentTime - 10
      );

  }
);



/* FORWARD 10 SECONDS */

forward.addEventListener(
  "click",
  () => {

    audio.currentTime =
      Math.min(
        audio.duration || 0,
        audio.currentTime + 10
      );

  }
);



/* END */

audio.addEventListener(
  "ended",
  () => {

    progress.value = 0;

    current.textContent = "0:00";

  }
);


/* AUDIO ERROR CHECK */

audio.addEventListener(
  "error",
  () => {

    console.error(
      "MP3 file could not be loaded."
    );

  }
);

</script>


</body>
</html>
