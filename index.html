<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RE:PLAY Player</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  background: #181818;
  color: #ffffff;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
}

.player {
  width: 100%;
  min-height: 130px;
  padding: 18px 26px;

  display: grid;
  grid-template-columns: 300px minmax(300px, 1fr) 220px;
  align-items: center;
  gap: 30px;

  background: #181818;
  border-top: 1px solid #303030;
}

/* 왼쪽 곡 정보 */

.track-info {
  display: flex;
  align-items: center;
  gap: 15px;
  min-width: 0;
}

.cover {
  width: 84px;
  height: 84px;
  object-fit: cover;
  flex-shrink: 0;
}

.track-text {
  min-width: 0;
}

.title {
  margin-bottom: 7px;
  font-size: 15px;
  font-weight: 600;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.artist {
  color: #aaa;
  font-size: 12px;

  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 가운데 */

.center {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 28px;
}

button {
  border: 0;
  background: transparent;
  color: white;
  cursor: pointer;
  padding: 5px;

  display: flex;
  align-items: center;
  justify-content: center;
}

button svg {
  width: 22px;
  height: 22px;
  fill: currentColor;
}

.skip {
  color: #ccc;
}

.skip:hover {
  color: white;
}

.play {
  width: 42px;
  height: 42px;
  border-radius: 50%;

  background: white;
  color: #111;
}

.play svg {
  width: 20px;
  height: 20px;
}

/* 재생바 */

.progress-wrap {
  width: 100%;

  display: grid;
  grid-template-columns: 40px 1fr 40px;
  align-items: center;
  gap: 10px;
}

.time {
  font-size: 11px;
  color: #aaa;
  text-align: center;
}

input[type="range"] {
  cursor: pointer;
  accent-color: white;
}

#progress {
  width: 100%;
  margin: 0;
}

/* 볼륨 */

.volume {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 10px;
}

.volume svg {
  width: 20px;
  height: 20px;
  fill: white;
}

#volume {
  width: 100px;
}

/* 노션에서 폭이 좁아졌을 때 */

@media (max-width: 750px) {
  .player {
    grid-template-columns: 1fr;
  }

  .volume {
    display: none;
  }
}
</style>
</head>

<body>

<!-- ★ 실제 음악 파일 : R 대문자 -->
<audio
  id="audio"
  src="Replay.mp3"
  preload="metadata">
</audio>

<div class="player">

  <!-- 앨범 -->

  <div class="track-info">

    <img
      class="cover"
      src="cover.png"
      alt="RE:PLAY cover">

    <div class="track-text">

      <div class="title">
        난 아직
      </div>

      <div class="artist">
        HYESEONG × SEUNGWOO
      </div>

    </div>

  </div>


  <!-- 플레이어 -->

  <div class="center">

    <div class="controls">

      <!-- 10초 뒤로 -->

      <button
        class="skip"
        id="back"
        aria-label="10초 뒤로">

        <svg viewBox="0 0 24 24">
          <path d="M11 5V2L6 6l5 4V7c3.31 0 6 2.69 6 6s-2.69 6-6 6a6 6 0 0 1-5.65-4H3.26A8 8 0 1 0 11 5z"/>
        </svg>

      </button>


      <!-- 재생 -->

      <button
        class="play"
        id="play"
        aria-label="재생">

        <svg
          id="playIcon"
          viewBox="0 0 24 24">

          <path d="M8 5v14l11-7z"/>

        </svg>

      </button>


      <!-- 10초 앞으로 -->

      <button
        class="skip"
        id="forward"
        aria-label="10초 앞으로">

        <svg viewBox="0 0 24 24">
          <path d="M13 5V2l5 4-5 4V7c-3.31 0-6 2.69-6 6s2.69 6 6 6a6 6 0 0 0 5.65-4h2.09A8 8 0 1 1 13 5z"/>
        </svg>

      </button>

    </div>


    <!-- 재생 위치 -->

    <div class="progress-wrap">

      <span
        class="time"
        id="current">
        0:00
      </span>

      <input
        id="progress"
        type="range"
        min="0"
        max="100"
        value="0"
        step="0.1">

      <span
        class="time"
        id="duration">
        0:00
      </span>

    </div>

  </div>


  <!-- 볼륨 -->

  <div class="volume">

    <svg viewBox="0 0 24 24">
      <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12zm-2.5-8.23v2.06A7 7 0 0 1 14 18.17v2.06A9 9 0 0 0 14 3.77z"/>
    </svg>

    <input
      id="volume"
      type="range"
      min="0"
      max="1"
      value="1"
      step="0.01">

  </div>

</div>


<script>

const audio = document.getElementById("audio");

const playButton = document.getElementById("play");
const playIcon = document.getElementById("playIcon");

const back = document.getElementById("back");
const forward = document.getElementById("forward");

const progress = document.getElementById("progress");

const current = document.getElementById("current");
const duration = document.getElementById("duration");

const volume = document.getElementById("volume");


function formatTime(seconds) {

  if (!Number.isFinite(seconds)) {
    return "0:00";
  }

  const min = Math.floor(seconds / 60);
  const sec = Math.floor(seconds % 60);

  return min + ":" + String(sec).padStart(2, "0");
}


/* 음악 정보 로딩 */

audio.addEventListener("loadedmetadata", () => {

  duration.textContent = formatTime(audio.duration);

});


/* 재생 */

playButton.addEventListener("click", async () => {

  if (audio.paused) {

    try {
      await audio.play();
    }

    catch (error) {
      console.error(error);
    }

  } else {

    audio.pause();

  }

});


/* 재생 아이콘 → 일시정지 */

audio.addEventListener("play", () => {

  playIcon.innerHTML =
    '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';

});


/* 일시정지 → 재생 아이콘 */

audio.addEventListener("pause", () => {

  playIcon.innerHTML =
    '<path d="M8 5v14l11-7z"/>';

});


/* 재생 시간 */

audio.addEventListener("timeupdate", () => {

  current.textContent = formatTime(audio.currentTime);

  if (audio.duration) {

    progress.value =
      (audio.currentTime / audio.duration) * 100;

  }

});


/* 재생바 직접 이동 */

progress.addEventListener("input", () => {

  if (!audio.duration) return;

  audio.currentTime =
    (Number(progress.value) / 100) * audio.duration;

});


/* 볼륨 */

volume.addEventListener("input", () => {

  audio.volume = Number(volume.value);

});


/* 10초 뒤로 */

back.addEventListener("click", () => {

  audio.currentTime =
    Math.max(0, audio.currentTime - 10);

});


/* 10초 앞으로 */

forward.addEventListener("click", () => {

  audio.currentTime =
    Math.min(
      audio.duration || 0,
      audio.currentTime + 10
    );

});


/* 음악 종료 */

audio.addEventListener("ended", () => {

  progress.value = 0;
  current.textContent = "0:00";

});

</script>

</body>
</html>
